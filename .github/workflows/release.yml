name: Release

# Builds a distributable from an existing tag and attaches the artefacts to the
# run. Publishing to PyPI is done manually with twine, so that the released
# files are exactly the ones that were tested locally.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build (e.g. v0.2.0)"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build and check
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ inputs.tag }}
          path: dist/*
