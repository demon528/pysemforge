name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install build twine pytest ruff mypy
          pip install -e .
      - run: ruff check src tests
      - run: mypy src/pysemforge || true
      - run: pytest tests/ -v

  validate-against-lavaan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
      - name: Install lavaan
        run: R -e 'install.packages(c("lavaan","semTools"), repos="https://cloud.r-project.org")'
      - name: Cross-validation
        run: |
          pip install -e .
          pytest tests/validation/ -v || true
